<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المدير</title>
<style>
:root{--navy:#1e3a5f;--bg:#f2f5f9;--line:#dfe5ec;--green:#1e8e5a;--red:#d64545;--gold:#e0a21a}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:#22313f}
header{background:var(--navy);color:#fff;padding:12px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{margin:0 12px 0 0;font-size:19px}
button{font-family:inherit;cursor:pointer;border:0;border-radius:7px;padding:8px 14px;background:var(--navy);color:#fff}
header button{background:transparent;color:#cfdcec}header button.on{background:#fff;color:var(--navy);font-weight:bold}
main{max-width:1300px;margin:16px auto;padding:0 12px}
input,select{font-family:inherit;padding:8px;border:1px solid var(--line);border-radius:7px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:#eef2f7}tfoot td{font-weight:bold;background:#eef2f7}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.k b{display:block;font-size:20px;margin-top:4px}.ok{color:var(--green)}.no{color:var(--red)}
td.tx{white-space:normal;text-align:right;min-width:190px;font-size:13px;line-height:1.7}
#login{max-width:340px;margin:80px auto;display:grid;gap:10px}
@media print{header,.bar{display:none}}
</style></head><body>
<div id="login" class="card"><h2 style="margin:0">🔑 دخول المدير</h2>
<input id="em" type="email" placeholder="الإيميل"><input id="pw" type="password" placeholder="الباسورد">
<div id="err" class="no"></div><button onclick="doLogin()">دخول</button></div>
<div id="app" style="display:none">
<header><h1>📊 لوحة المدير</h1>
<button data-v="sum" class="on">ملخص</button><button data-v="posted">الترحيلات</button>
<button data-v="journal">دفتر اليومية</button><button data-v="br">الفروع والقفل</button>
<span style="flex:1"></span><small id="upd"></small><button onclick="load()">🔄 تحديث</button><button onclick="logout()">خروج</button></header>
<main id="main"></main></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>if(typeof firebase==='undefined'){document.getElementById('err').textContent='مكتبة Firebase ماتحمّلتش: تأكد من النت أو عطّل AdBlock وحدّث الصفحة';}else{document.getElementById('err').style.color='#777';document.getElementById('err').textContent='✓ جاهز للدخول';}</script>
<script>
const FB_CFG={apiKey:"AIzaSyAW4xUKrft6bzQCnRY8jGrSd4xVG3fVdZg",authDomain:"yomayt-2026.firebaseapp.com",projectId:"yomayt-2026",storageBucket:"yomayt-2026.firebasestorage.app",messagingSenderId:"10138968379",appId:"1:10138968379:web:192bc02d91dcbdb12b171e"};
firebase.initializeApp(FB_CFG);const fa=firebase.auth(),fs=firebase.firestore();
const DOM='yawmiyat.example.com';
const q=id=>document.getElementById(id), fmt=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const jd=d=>{const [y,m,x]=d.split('-');return +x+'/'+ +m+'/'+y};
let view='sum', D={br:[],en:[],lk:[]}, F={b:'',f:'',t:''}, E={}, unsubs={}, tm;
function J(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
async function chk(){const u=fa.currentUser;const a=await fs.doc('admins/'+u.uid).get();
 if(!a.exists){q('err').textContent='الحساب ده مش مدير';localStorage.removeItem('yw_admin');await fa.signOut();return;}
 localStorage.setItem('yw_admin','{"ok":1}');start();}
async function doLogin(){q('err').textContent='⏳ جاري الدخول...';try{await Promise.race([(async()=>{await fa.signInWithEmailAndPassword(q('em').value.trim(),q('pw').value);await chk();})(),new Promise((_,j)=>setTimeout(()=>j({code:'timeout'}),25000))]);}
 catch(e){const c=e.code||'',M={'auth/network-request-failed':'تعذّر الدخول (تأكد من النت)','timeout':'الاتصال بـ Firebase اتأخر: جرّب نت تاني أو تأكد إن Firestore اتعمل وRules اتنشرت','auth/unauthorized-domain':'الدومين ده مش مضاف في Firebase ← Authentication ← Settings ← Authorized domains','auth/invalid-credential':'الإيميل أو الباسورد غلط','auth/wrong-password':'الباسورد غلط','auth/user-not-found':'الإيميل ده مش موجود في Authentication','auth/invalid-email':'صيغة الإيميل غلط','auth/operation-not-allowed':'فعّل Email/Password من Authentication ← Sign-in method','auth/too-many-requests':'محاولات كتير، استنى شوية وجرّب','permission-denied':'مشكلة صلاحيات: تأكد إن Rules اتنشرت (Publish) وإن مستند admins موجود'};
  q('err').textContent=(M[c]||'خطأ: '+(c||e.message))+(M[c]?'':'');}}
function logout(){localStorage.removeItem('yw_admin');fa.signOut().catch(()=>{}).finally(()=>location.reload());}
function upd(){clearTimeout(tm);tm=setTimeout(()=>{q('upd').textContent='آخر تحديث '+new Date().toLocaleTimeString('ar-EG');draw();},150);}
function load(){draw();}
function start(){if(window._st)return;window._st=1;q('login').style.display='none';q('app').style.display='block';
 fs.collection('branches').onSnapshot(sn=>{
  D.br=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));
  D.lk=[];D.br.forEach(b=>(b.locks||[]).forEach(p=>D.lk.push({branch_id:b.id,page:p})));
  D.br.forEach(b=>{if(unsubs[b.id])return;unsubs[b.id]=fs.collection('branches/'+b.id+'/entries').onSnapshot(es=>{
   E[b.id]=es.docs.map(d=>{const x=d.data();return {branch_id:b.id,kind:x.kind,date:x.date,data:JSON.parse(x.json)}});
   D.en=[].concat(...Object.values(E));upd();});});
  upd();},e=>{q('main').innerHTML='<div class="card no">تعذّر التحميل: '+e.message+'</div>';});}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bn=id=>(D.br.find(b=>b.id===id)||{name:'؟'}).name;
const eTot=r=>(r.exp||[]).reduce((a,x)=>a+(+x.a||0),0);
function rows(kind){return D.en.filter(e=>e.kind===kind&&(!F.b||e.branch_id===F.b)&&(!F.f||e.date>=F.f)&&(!F.t||e.date<=F.t)).sort((a,b)=>b.date.localeCompare(a.date)||bn(a.branch_id).localeCompare(bn(b.branch_id)));}
function filt(){return '<div class="bar"><select id="fb" onchange="F.b=this.value;draw()"><option value="">كل الفروع</option>'+D.br.map(b=>'<option value="'+b.id+'"'+(F.b===b.id?' selected':'')+'>'+b.name+'</option>').join('')+'</select>من <input type="date" value="'+F.f+'" onchange="F.f=this.value;draw()"> إلى <input type="date" value="'+F.t+'" onchange="F.t=this.value;draw()"><button onclick="F={b:\'\',f:\'\',t:\'\'};draw()">مسح الفلتر</button><button onclick="csv()">⬇ Excel/CSV</button><button onclick="print()">🖨 طباعة</button></div>';}
function tbl(kind){const R=rows(kind),T={c:0,r:0,t:0,e:0,n:0,v:0};
 const b=R.map(e=>{const r=e.data,x=eTot(r);T.c+=r.cash||0;T.r+=r.rates||0;T.t+=r.tr||0;T.e+=x;T.n+=r.net||0;T.v+=r.vault||0;
  const nt=(r.notes||[]).map(n=>esc(n.s)).join('<br>'),ex=(r.exp||[]).map(y=>esc(y.s||'—')+': '+fmt(y.a)).join('<br>');
  return '<tr><td>'+bn(e.branch_id)+'</td><td>'+jd(r.date)+'</td><td>'+fmt(r.cash)+'</td><td>'+fmt(r.rates)+'</td><td>'+fmt(r.tr)+'</td><td>'+fmt(x)+'</td><td>'+fmt(r.prev)+'</td><td>'+fmt(r.net)+'</td><td>'+fmt(r.vault)+'</td><td>'+(r.actual==null?'—':fmt(r.actual))+'</td><td class="'+(r.diff?'no':'')+'">'+(r.diff==null?'—':fmt(r.diff))+'</td><td class="tx">'+ex+'</td><td class="tx">'+nt+'</td></tr>';}).join('');
 return '<div class="card">'+filt()+'<table id="t"><thead><tr><th>الفرع</th><th>التاريخ</th><th>نقدي</th><th>نسب</th><th>تحويلات</th><th>مصروفات</th><th>سابق</th><th>صافي اليوم</th><th>صافي الخزنة</th><th>الفعلي</th><th>الفرق</th><th>البيان</th><th>ملاحظات وموردين</th></tr></thead><tbody>'+(b||'<tr><td colspan="13">لا توجد بيانات</td></tr>')+'</tbody><tfoot><tr><td colspan="2">الإجمالي ('+R.length+')</td><td>'+fmt(T.c)+'</td><td>'+fmt(T.r)+'</td><td>'+fmt(T.t)+'</td><td>'+fmt(T.e)+'</td><td></td><td>'+fmt(T.n)+'</td><td>'+fmt(T.v)+'</td><td colspan="4"></td></tr></tfoot></table></div>';}
function csv(){const R=rows(view),Q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',T=[0,0,0,0,0,0];
 const L=[['الفرع','التاريخ','نقدي','نسب','تحويلات','مصروفات','سابق','صافي اليوم','صافي الخزنة','الفعلي','الفرق','البيان','ملاحظات وموردين'].map(Q).join(',')];
 R.forEach(e=>{const r=e.data,x=eTot(r);T[0]+=r.cash||0;T[1]+=r.rates||0;T[2]+=r.tr||0;T[3]+=x;T[4]+=r.net||0;T[5]+=r.vault||0;
  L.push([Q(bn(e.branch_id)),Q(jd(r.date)),r.cash||0,r.rates||0,r.tr||0,x,r.prev||0,r.net||0,r.vault||0,r.actual==null?'':r.actual,r.diff==null?'':r.diff,Q((r.exp||[]).map(y=>(y.s||'—')+': '+y.a).join(' | ')),Q((r.notes||[]).map(n=>n.s).join(' | '))].join(','));});
 L.push([Q('الإجمالي'),'',T[0],T[1],T[2],T[3],'',T[4],T[5],'','','',''].join(','));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download=(view==='journal'?'دفتر-اليومية-':'الترحيلات-')+new Date().toISOString().slice(0,10)+'.csv';a.click();}
function sum(){const td=new Date(),today=td.getFullYear()+'-'+String(td.getMonth()+1).padStart(2,'0')+'-'+String(td.getDate()).padStart(2,'0');
 let G=0,N=0;const c=D.br.map(b=>{const P=D.en.filter(e=>e.kind==='posted'&&e.branch_id===b.id).sort((x,y)=>y.date.localeCompare(x.date)),l=P[0],done=P.some(e=>e.date===today);
  const v=P.reduce((a,e)=>a+(e.data.vault||0),0),n=P.reduce((a,e)=>a+(e.data.net||0),0);G+=v;N+=n;
  return '<div class="card k"><b style="font-size:17px">'+b.name+(b.active?'':' (موقوف)')+'</b><small>آخر ترحيل: '+(l?jd(l.date):'—')+'</small><div class="'+(done?'ok':'no')+'">'+(done?'✔ رحّل النهاردة':'⚠ لسه ماترحّلش النهاردة')+'</div><small>أيام مرحّلة: '+P.length+'</small><b>'+fmt(v)+'</b><small>إجمالي صافي الخزنة</small></div>';}).join('');
 return '<div class="card k"><small>إجمالي كل الفروع</small><b>خزنة: '+fmt(G)+' &nbsp;|&nbsp; صافي: '+fmt(N)+'</b></div><div class="grid">'+c+'</div>';}
function brs(){const L=(b,p)=>D.lk.some(x=>x.branch_id===b&&x.page===p);
 return '<div class="card"><table><thead><tr><th>الفرع</th><th>الباسورد</th><th>مقفول: اليوميات</th><th>مقفول: الترحيل</th><th>مقفول: الدفتر</th><th>الحالة</th></tr></thead><tbody>'+D.br.map(b=>'<tr><td>'+b.name+'</td><td><button onclick="resetBr(\''+b.id+'\')">تغيير الباسورد</button></td>'+['p1','p2','p3'].map(p=>'<td><input type="checkbox" '+(L(b.id,p)?'checked':'')+' onchange="lock(\''+b.id+'\',\''+p+'\',this.checked)"></td>').join('')+'<td><button style="background:'+(b.active?'var(--green)':'var(--red)')+'" onclick="act(\''+b.id+'\','+!b.active+')">'+(b.active?'نشط':'موقوف')+'</button></td></tr>').join('')+'</tbody></table></div>'+
 '<div class="card"><b>إضافة فرع</b><div class="bar" style="margin-top:8px"><input id="nn" placeholder="اسم الفرع"><input id="np" placeholder="باسورد الفرع (6 على الأقل)"><button onclick="addBr()">إضافة</button></div><small>لو فرع نسي الباسورد اضغط "تغيير الباسورد" وبياناته بتفضل محفوظة.</small></div>';}
const FV=firebase.firestore.FieldValue;
async function lock(b,p,on){try{await fs.doc('branches/'+b).update({locks:on?FV.arrayUnion(p):FV.arrayRemove(p)});}catch(e){alert(e.message);}}
async function act(id,v){try{const b=fs.batch();b.update(fs.doc('branches/'+id),{active:v});b.update(fs.doc('branchPublic/'+id),{active:v});await b.commit();}catch(e){alert(e.message);}}
async function mkUser(email,pw){const a=firebase.initializeApp(FB_CFG,'sec'+Date.now());
 try{const c=await a.auth().createUserWithEmailAndPassword(email,pw);const uid=c.user.uid;await a.auth().signOut();return uid;}finally{a.delete();}}
async function addBr(){const n=q('nn').value.trim(),p=q('np').value;
 if(!n||p.length<6){alert('اكتب اسم الفرع وباسورد 6 حروف أو أرقام على الأقل');return;}
 try{const id='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),email=id+'@'+DOM,uid=await mkUser(email,p),b=fs.batch();
  b.set(fs.doc('branches/'+id),{name:n,email,uid,active:true,locks:[]});b.set(fs.doc('branchPublic/'+id),{name:n,email,active:true});
  await b.commit();q('nn').value='';q('np').value='';alert('تم إضافة الفرع ✔');}catch(x){alert(x.message);}}
async function resetBr(id){const p=prompt('اكتب الباسورد الجديد للفرع (6 على الأقل)');if(!p)return;if(p.length<6){alert('الباسورد أقل من 6');return;}
 try{const email=id+'r'+Date.now().toString(36)+'@'+DOM,uid=await mkUser(email,p),b=fs.batch();
  b.update(fs.doc('branches/'+id),{email,uid});b.update(fs.doc('branchPublic/'+id),{email});await b.commit();alert('تم تغيير الباسورد ✔');}catch(x){alert(x.message);}}
function draw(){q('main').innerHTML=view==='sum'?sum():view==='br'?brs():tbl(view);}
document.querySelectorAll('header [data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('header [data-v]').forEach(x=>x.classList.toggle('on',x===b));draw();window.scrollTo(0,0);});
fa.onAuthStateChanged(u=>{if(u&&J('yw_admin'))chk().catch(()=>{});});
</script></body></html>
