const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function zipBlob(files){

const xe=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const xcol=c=>String.fromCharCode(64+c);
function XL(widths){
  const st=[{}],sm={},o={cells:{},merges:[],hts:{},breaks:[]};
  const sty=z=>{const k=JSON.stringify(z);if(!(k in sm)){sm[k]=st.length;st.push(z);}return sm[k];};
  o.put=(r,c,v,z)=>{o.cells[r+','+c]={r,c,v,s:sty(z||{})};};
  o.span=(r,c1,c2,v,z)=>{for(let c=c1;c<=c2;c++)o.put(r,c,c===c1?v:'',z);if(c2>c1)o.merges.push(xcol(c1)+r+':'+xcol(c2)+r);};
  o.ht=(r,h)=>{o.hts[r]=h;};
  o.blob=sheetName=>{
    const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',NS='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
    const fonts=['<font><sz val="11"/><name val="Calibri"/></font>'],fills=['<fill><patternFill patternType="none"/></fill>','<fill><patternFill patternType="gray125"/></fill>'];
    const xfs=['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];
    st.forEach((z,i)=>{if(!i)return;
      fonts.push(`<font>${z.b?'<b/>':''}<sz val="${z.sz||11}"/>${z.color?`<color rgb="FF${z.color}"/>`:''}<name val="Calibri"/></font>`);
      let f=0;if(z.fill){fills.push(`<fill><patternFill patternType="solid"><fgColor rgb="FF${z.fill}"/><bgColor indexed="64"/></patternFill></fill>`);f=fills.length-1;}
      xfs.push(`<xf numFmtId="${z.nf||0}" fontId="${fonts.length-1}" fillId="${f}" borderId="${z.bd?1:0}" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyNumberFormat="1" applyAlignment="1"><alignment horizontal="${z.h||'general'}" vertical="center" readingOrder="2" wrapText="1"/></xf>`);
    });
    const bs=c=>`<${c} style="thin"><color rgb="FFC5CFDB"/></${c}>`;
    const styles=H+`<styleSheet ${NS}><fonts count="${fonts.length}">${fonts.join('')}</fonts><fills count="${fills.length}">${fills.join('')}</fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border>${bs('left')}${bs('right')}${bs('top')}${bs('bottom')}<diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${xfs.length}">${xfs.join('')}</cellXfs></styleSheet>`;
    const rows={};Object.values(o.cells).forEach(c=>{(rows[c.r]=rows[c.r]||[]).push(c)});
    const sd=Object.keys(rows).map(Number).sort((a,b)=>a-b).map(r=>`<row r="${r}"${o.hts[r]?` ht="${o.hts[r]}" customHeight="1"`:''}>`+rows[r].sort((a,b)=>a.c-b.c).map(c=>{
      const ref=xcol(c.c)+r;
      if(c.v===''||c.v==null)return `<c r="${ref}" s="${c.s}"/>`;
      return typeof c.v==='number'?`<c r="${ref}" s="${c.s}"><v>${c.v}</v></c>`:`<c r="${ref}" s="${c.s}" t="inlineStr"><is><t xml:space="preserve">${xe(c.v)}</t></is></c>`;
    }).join('')+'</row>').join('');

      +(o.merges.length?`<mergeCells count="${o.merges.length}">${o.merges.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells>`:'')
      +`<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="portrait" fitToWidth="1" fitToHeight="0"/>`
      +(o.breaks.length?`<rowBreaks count="${o.breaks.length}" manualBreakCount="${o.breaks.length}">${o.breaks.map(b=>`<brk id="${b}" max="16383" man="1"/>`).join('')}</rowBreaks>`:'')+'</worksheet>';
    return zipBlob([
      {name:'[Content_Types].xml',data:H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},

  const x=XL([15,17,36,32]);
  const T={b:1,sz:14,color:'1E3A5F',fill:'EAF0F7',h:'center',bd:1}, BX={b:1,color:'162C49',fill:'F7FAFD',bd:1};
  const HD=f=>({b:1,color:'FFFFFF',fill:f,h:'center',bd:1});
  const list=rows('journal').slice().sort((a,b)=>a.date.localeCompare(b.date)||bn(a.branch_id).localeCompare(bn(b.branch_id),'ar'));
  if(!list.length){alert('مفيش بيانات للتصدير');return;}
  let r=1;
  list.forEach((e,pi)=>{const p=e.data,ex=p.exp||[],exTot=ex.reduce((a,z)=>a+nm(z.a),0),inc=nm(p.cash)+nm(p.rates)+nm(p.tr);
    x.span(r,1,4,bn(e.branch_id)+' — '+jDay(p.date)+' — '+jDate(p.date),T);x.ht(r,28);
    x.span(r+1,1,2,'الفرع : '+bn(e.branch_id),BX);x.span(r+1,3,4,'التاريخ : '+jDate(p.date),BX);x.ht(r+1,26);
    x.put(r+2,1,'ايراد',HD('2F7D4F'));x.put(r+2,2,'مصروف',HD('1F4E79'));x.put(r+2,3,'البيـان',HD('1A7A8C'));x.put(r+2,4,'ملاحظات وموردين',HD('0C3A4B'));x.ht(r+2,26);
    const rw=[['• اجمالى ايرادات نقدى',nm(p.cash),null],['• اجمالى ايرادات نسب',nm(p.rates),null],['• اجمالى ايرادات تحويلات',nm(p.tr),null],...ex.map(z=>[z.s||'—',null,nm(z.a)])];
    const nt=p.notes||[],n=Math.max(12,rw.length,nt.length);
    for(let k=0;k<n;k++){const w=rw[k]||[],rr=r+3+k;
      x.put(rr,1,w[1]!=null?w[1]:'',{b:1,color:'1E8E5A',h:'center',bd:1,nf:4});
      x.put(rr,2,w[2]!=null?w[2]:'',{b:1,color:'D64545',h:'center',bd:1,nf:4});
      x.put(rr,3,w[0]||'',{b:1,color:'162C49',bd:1});x.put(rr,4,nt[k]?nt[k].s:'',{b:1,color:'162C49',bd:1});x.ht(rr,22);}
    const s0=r+3+n;
    x.span(s0,1,4,'ملخص اليوم',{b:1,sz:13,color:'FFFFFF',fill:'0B2F5B',h:'center',bd:1});x.ht(s0,26);
    [['5BB0C9','👛','رصيد سابق',nm(p.prev)],['2FA35F','📈','إجمالي ايرادات',inc],['E0383E','📉','إجمالي مصروفات',exTot],['9B59B6','🪙','صافي النقديه',nm(p.prev)+inc-exTot],['F0A021','🔐','رصيد فعلى',nm(p.prev)+nm(p.cash)+nm(p.rates)-exTot]].forEach((q,k)=>{
      const rr=s0+1+k;x.put(rr,1,q[1],{sz:14,fill:q[0],h:'center',bd:1});x.put(rr,2,q[2],{b:1,bd:1});x.span(rr,3,4,q[3],{b:1,sz:12,h:'center',bd:1,nf:4});x.ht(rr,26);});
    const last=s0+5;if(pi<list.length-1)x.breaks.push(last+1);
    r=last+2;});
  const blob=x.blob('دفتر اليومية'),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='دفتر-اليومية-'+(F.f||list[0].date)+'-'+(F.t||list[list.length-1].date)+'.xlsx';document.body.appendChild(a);a.click();a.remove();}

function csv(){const R=rows(view),Q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',T=[0,0,0,0,0,0];
 const L=[['الفرع','التاريخ','نقدي','نسب','تحويلات','مصروفات','سابق','صافي اليوم','صافي الخزنة','الفعلي','الفرق','البيان','ملاحظات وموردين'].map(Q).join(',')];
 R.forEach(e=>{const r=e.data,x=eTot(r);T[0]+=r.cash||0;T[1]+=r.rates||0;T[2]+=r.tr||0;T[3]+=x;T[4]+=r.net||0;T[5]+=r.vault||0;
  L.push([Q(bn(e.branch_id)),Q(jd(r.date)),r.cash||0,r.rates||0,r.tr||0,x,r.prev||0,r.net||0,r.vault||0,r.actual==null?'':r.actual,r.diff==null?'':r.diff,Q((r.exp||[]).map(y=>(y.s||'—')+': '+y.a).join(' | ')),Q((r.notes||[]).map(n=>n.s).join(' | '))].join(','));});
 L.push([Q('الإجمالي'),'',T[0],T[1],T[2],T[3],'',T[4],T[5],'','','',''].join(','));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download=(view==='journal'?'دفتر-اليومية-':'الترحيلات-')+new Date().toISOString().slice(0,10)+'.csv';a.click();}
function sum(){const td=new Date(),today=td.getFullYear()+'-'+String(td.getMonth()+1).padStart(2,'0')+'-'+String(td.getDate()).padStart(2,'0');
 let G=0,N=0;const c=D.br.map(b=>{const P=D.en.filter(e=>e.kind==='posted'&&e.branch_id===b.id).sort((x,y)=>y.date.localeCompare(x.date)),l=P[0],done=P.some(e=>e.date===today);
  const v=P.reduce((a,e)=>a+(e.data.vault||0),0),n=P.reduce((a,e)=>a+(e.data.net||0),0);G+=v;N+=n;
  return '<div class="card k"><b style="font-size:17px">'+b.name+(b.active?'':' (موقوف)')+'</b><small>آخر ترحيل: '+(l?jd(l.date):'—')+'</small><div class="'+(done?'ok':'no')+'">'+(done?'✔ رحّل النهاردة':'⚠ لسه ماترحّلش النهاردة')+'</div><small>أيام مرحّلة: '+P.length+'</small><b>'+fmt(v)+'</b><small>إجمالي صافي الخزنة</small></div>';}).join('');
 return '<div class="card k"><small>إجمالي كل الفروع</small><b>خزنة: '+fmt(G)+' &nbsp;|&nbsp; صافي: '+fmt(N)+'</b></div><div class="grid">'+c+'</div>';}
function brs(){const L=(b,p)=>D.lk.some(x=>x.branch_id===b&&x.page===p);
 return '<div class="card"><table><thead><tr><th>الفرع</th><th>الباسورد</th><th>مقفول: اليوميات</th><th>مقفول: الترحيل</th><th>مقفول: الدفتر</th><th>الحالة</th></tr></thead><tbody>'+D.br.map(b=>'<tr><td>'+b.name+'</td><td><button onclick="resetBr(\''+b.id+'\')">تغيير الباسورد</button></td>'+['p1','p2','p3'].map(p=>'<td><input type="checkbox" '+(L(b.id,p)?'checked':'')+' onchange="lock(\''+b.id+'\',\''+p+'\',this.checked)"></td>').join('')+'<td><button style="background:'+(b.active?'var(--green)':'var(--red)')+'" onclick="act(\''+b.id+'\','+!b.active+')">'+(b.active?'نشط':'موقوف')+'</button></td></tr>').join('')+'</tbody></table></div>'+
 '<div class="card"><b>إضافة فرع</b><div class="bar" style="margin-top:8px"><input id="nn" placeholder="اسم الفرع"><input id="np" placeholder="باسورد الفرع (6 على الأقل)"><button onclick="addBr()">إضافة</button></div><small>لو فرع نسي الباسورد اضغط "تغيير الباسورد" وبياناته بتفضل محفوظة.</small></div>';}
const FV=firebase.firestore.FieldValue;
async function lock(b,p,on){try{await fs.doc('branches/'+b).update({locks:on?FV.arrayUnion(p):FV.arrayRemove(p)});}catch(e){alert(e.message);}}
async function act(id,v){try{const b=fs.batch();b.update(fs.doc('branches/'+id),{active:v});b.update(fs.doc('branchPublic/'+id),{active:v});await b.commit();}catch(e){alert(e.message);}}
async function mkUser(email,pw){const a=firebase.initializeApp(FB_CFG,'sec'+Date.now());
 try{const c=await a.auth().createUserWithEmailAndPassword(email,pw);const uid=c.user.uid;await a.auth().signOut();return uid;}finally{a.delete();}}
async function addBr(){const n=q('nn').value.trim(),p=q('np').value;
 if(!n||p.length<6){alert('اكتب اسم الفرع وباسورد 6 حروف أو أرقام على الأقل');return;}
 try{const id='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),email=id+'@'+DOM,uid=await mkUser(email,p),b=fs.batch();
  b.set(fs.doc('branches/'+id),{name:n,email,uid,active:true,locks:[]});b.set(fs.doc('branchPublic/'+id),{name:n,email,active:true});
  await b.commit();q('nn').value='';q('np').value='';alert('تم إضافة الفرع ✔');}catch(x){alert(x.message);}}
async function resetBr(id){const p=prompt('اكتب الباسورد الجديد للفرع (6 على الأقل)');if(!p)return;if(p.length<6){alert('الباسورد أقل من 6');return;}
 try{const email=id+'r'+Date.now().toString(36)+'@'+DOM,uid=await mkUser(email,p),b=fs.batch();
  b.update(fs.doc('branches/'+id),{email,uid});b.update(fs.doc('branchPublic/'+id),{email});await b.commit();alert('تم تغيير الباسورد ✔');}catch(x){alert(x.message);}}
function draw(){q('main').innerHTML=view==='sum'?sum():view==='br'?brs():tbl(view);}
